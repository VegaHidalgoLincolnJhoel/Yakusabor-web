<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Yaku Sabor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../CSS/styledash.css?v=2">
</head>

<body>
    <nav class="navbar navbar-expand bg-white shadow-sm py-2">
        <div class="container-fluid">
            <div class="ms-auto d-flex align-items-center gap-3">
                <div class="text-end">
                    <div class="fw-semibold text-primary" id="dashboardUserName">Usuario</div>
                    <small class="text-muted" id="dashboardUserRole">Rol</small>
                </div>
                <button class="btn btn-outline-danger btn-sm" type="button" id="dashboardLogoutBtn">
                    Cerrar sesión
                </button>
                <a href="#" class="profile-link d-flex align-items-center text-decoration-none">
                    <img src="../../../img/register2.png" alt="perfil" class="profile-img">
                </a>
            </div>
        </div>
    </nav>

    <div class="dashboard-wrapper">
        <div class="dashboard-grid">
            <aside class="col-left">
                <div class="restaurant-card p-3">
                    <div class="restaurant-header">
                        <img src="../../../img/ICON1.png" alt="icon" class="icon-img">
                    </div>

                    <div class="left-options mt-3 d-grid gap-2">
                        <!-- Gestión de Sala -->
                        <a href="Gestion DeSala.html" class="btn-pdf js-dashboard-link"
                            data-title="Gestión de Sala" data-roles="ADMINISTRADOR,MESERO">Gestión de Sala</a>

                        <!-- Gestión Cocina -->
                        <a href="GestionDeCocinav2.html" class="btn-pdf js-dashboard-link"
                            data-title="Gestión Cocina" data-roles="ADMINISTRADOR,COCINERO">Gestión Cocina</a>

                        <!-- Gestión de Productos -->
                        <a href="Productos.html" class="btn-pdf js-dashboard-link"
                            data-title="Gestión de Productos" data-roles="ADMINISTRADOR,COCINERO">Gestión de Productos</a>

                        <!-- Factura -->
                        <a href="Factura.html" class="btn-pdf js-dashboard-link" data-title="Factura"
                            data-roles="ADMINISTRADOR,MESERO">Factura</a>

                        <!-- Reporte Ventas -->
                        <a href="ReporteVentas.html" class="btn-pdf js-dashboard-link" data-title="Reporte Ventas"
                            data-roles="ADMINISTRADOR">Reporte Ventas</a>

                        <!-- Gestión de Mozos -->
                        <a href="GestionMozos.html" class="btn-pdf js-dashboard-link"
                            data-title="Gestión de Mozos" data-roles="ADMINISTRADOR">Gestión de Mozos</a>
                    </div>
                </div>
            </aside>

            <main class="col-right">
                <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
                    <h2 class="right-title mb-0">Dashboard</h2>
                </div>

                <section class="card-panel module-viewer">
                    <div class="d-flex justify-content-between align-items-center gap-2 mb-3 flex-wrap">
                        <h3 id="viewer-title" class="h5 mb-0">Gestión de Sala</h3>
                    </div>

                    <div class="w-100">
                        <iframe id="dashboard-content-frame" class="module-frame w-100" title="Contenido del módulo"
                            src="Gestion DeSala.html"></iframe>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>

                function resolveApiBaseUrl() {
            const override = window.__API_BASE_URL__ || localStorage.getItem("apiBaseUrl");
            if (override) {
                return override.replace(/\/$/, "");
            }

            const { origin, hostname, protocol } = window.location;

            if (hostname.endsWith(".app.github.dev") || hostname.endsWith(".githubpreview.dev")) {
                return origin.replace(/-(\d+)\.app\.github\.dev$/, "-8080.app.github.dev").replace(/-(\d+)\.githubpreview\.dev$/, "-8080.githubpreview.dev") + "/api";
            }

            return `${protocol}//${hostname}:8080/api`;
        }
        
        const moduleLinks = Array.from(document.querySelectorAll('.js-dashboard-link'));
        const moduleFrame = document.getElementById('dashboard-content-frame');
        const viewerTitle = document.getElementById('viewer-title');
        const dashboardUserName = document.getElementById('dashboardUserName');
        const dashboardUserRole = document.getElementById('dashboardUserRole');
        const dashboardLogoutBtn = document.getElementById('dashboardLogoutBtn');

        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '../../Principal/HTML/index.html';
        }

        const authHeaders = () => ({
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`
        });

        const redirectToPublic = () => {
            localStorage.removeItem('token');
            localStorage.removeItem('rol');
            localStorage.removeItem('nombre');
            window.location.href = '../../Principal/HTML/index.html';
        };

        async function loadSession() {
            try {
                const res = await fetch(`${resolveApiBaseUrl()}/auth/me`, { headers: authHeaders() });
                if (!res.ok) { redirectToPublic(); return; }

                const data = await res.json();
                const nombre = data.nombre || 'Usuario';
                const rol = data.rol || 'Sin rol';

                localStorage.setItem('rol', rol);
                localStorage.setItem('nombre', nombre);

                dashboardUserName.textContent = nombre;
                dashboardUserRole.textContent = rol;

                // ── Si es Mesero, registrar presencia activa ──────────────
                if (rol.trim().toUpperCase() === 'MESERO') {
                    registrarMeseroActivo(nombre);
                }

                // ── Panel de tareas asignadas (solo Mesero) ────────────────
                iniciarPanelTareas(rol);

                if (rol.toLowerCase().includes('cliente')) {
                    redirectToPublic();
                    return;
                }

                let firstVisible = null;
                moduleLinks.forEach((link) => {
                    const roles = (link.dataset.roles || '')
                        .split(',')
                        .map(r => r.trim().toUpperCase())
                        .filter(Boolean);
                    const hasAccess = roles.length === 0 || roles.includes(rol.trim().toUpperCase());
                    link.style.display = hasAccess ? 'block' : 'none';
                    if (hasAccess && !firstVisible) firstVisible = link;
                });

                if (firstVisible) {
                    viewerTitle.textContent = firstVisible.dataset.title || 'Dashboard';
                    moduleFrame.src = firstVisible.getAttribute('href');
                } else {
                    viewerTitle.textContent = 'Sin permisos';
                    moduleFrame.srcdoc = '<div style="padding:24px;font-family:Arial,sans-serif;color:#1b3a57"><h4>Sin permisos</h4><p>No tienes acceso a ningún módulo.</p></div>';
                }

                moduleLinks.forEach((link) => {
                    if (link.style.display === 'none') return;
                    link.addEventListener('click', (event) => {
                        event.preventDefault();
                        const href = link.getAttribute('href');
                        const title = link.dataset.title || 'Vista del módulo';
                        if (!href || href === '#') {
                            viewerTitle.textContent = `${title} (pendiente)`;
                            moduleFrame.removeAttribute('src');
                            moduleFrame.srcdoc = '<div style="font-family:Arial,sans-serif;padding:24px;color:#1b3a57"><h4>Módulo pendiente</h4></div>';
                            return;
                        }
                        viewerTitle.textContent = title;
                        moduleFrame.removeAttribute('srcdoc');
                        moduleFrame.src = href;
                    });
                });
            } catch (err) {
                redirectToPublic();
            }
        }

        // ── Registrar mesero activo en localStorage ───────────────────────
        function registrarMeseroActivo(nombre) {
            try {
                const KEY = 'mozos_activos';
                const raw = localStorage.getItem(KEY);
                const activos = raw ? JSON.parse(raw) : {};
                activos[nombre] = Date.now();
                localStorage.setItem(KEY, JSON.stringify(activos));
            } catch (e) { /* silencioso */ }
        }

        // ── Panel flotante de tareas pendientes (solo rol Mesero) ─────────
        function iniciarPanelTareas(rol) {
            if (rol.trim().toUpperCase() !== 'MESERO') return;

            const panel = document.createElement('div');
            panel.id = 'panelTareas';
            panel.style.cssText = 'position:fixed;bottom:20px;right:20px;max-width:320px;z-index:2000;';
            document.body.appendChild(panel);

            async function cargarTareas() {
                try {
                    const res = await fetch(`${resolveApiBaseUrl()}/tareas/mias`, { headers: authHeaders() });
                    if (!res.ok) return;
                    const tareas = await res.json();

                    if (!tareas.length) { panel.innerHTML = ''; return; }

                    panel.innerHTML = tareas.map(t => `
                        <div style="background:#1b3a57;color:#fff;border-radius:12px;padding:12px 16px;margin-bottom:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);">
                            <div style="font-size:.72rem;opacity:.7;margin-bottom:4px;">📋 Tarea de ${t.asignadoPor}</div>
                            <div style="font-size:.9rem;margin-bottom:8px;">${t.mensaje}</div>
                            <button onclick="completarTarea(${t.id})" style="background:#16a34a;border:none;color:#fff;border-radius:8px;padding:5px 12px;font-size:.8rem;cursor:pointer;">✓ Hecho</button>
                        </div>
                    `).join('');
                } catch (e) { /* silencioso */ }
            }

            window.completarTarea = async function (id) {
                try {
                    await fetch(`${resolveApiBaseUrl()}/tareas/${id}/completar`, { method: 'PUT', headers: authHeaders() });
                    cargarTareas();
                } catch (e) { /* silencioso */ }
            };

            cargarTareas();
            setInterval(cargarTareas, 20000);
        }

        // ── Al cerrar sesión, quitar al mesero del registro ───────────────
        dashboardLogoutBtn.addEventListener('click', () => {
            const nombre = localStorage.getItem('nombre');
            const rol    = localStorage.getItem('rol') || '';
            if (rol.trim().toUpperCase() === 'MESERO' && nombre) {
                try {
                    const KEY = 'mozos_activos';
                    const raw = localStorage.getItem(KEY);
                    const activos = raw ? JSON.parse(raw) : {};
                    delete activos[nombre];
                    localStorage.setItem(KEY, JSON.stringify(activos));
                } catch (e) { /* silencioso */ }
            }
            localStorage.removeItem('token');
            localStorage.removeItem('rol');
            localStorage.removeItem('nombre');
            window.location.href = '../../Principal/HTML/index.html';
        });

        loadSession();
    </script>
</body>
</html>
