<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin Suite - Yaku Sabor</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- FontAwesome & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Styledash CSS -->
    <link rel="stylesheet" href="../CSS/styledash.css?v=4">
</head>

<body>
    <!-- Top Header -->
    <nav class="navbar navbar-expand bg-white py-2">
        <div class="container-fluid">
            <div class="d-flex align-items-center gap-2">
                <i class="fa-solid fa-shield-halved text-info fs-4"></i>
                <span class="fw-bold font-outfit fs-5 text-dark">Yaku Sabor <span class="badge bg-info text-dark ms-1">Admin Executive</span></span>
            </div>

            <div class="ms-auto d-flex align-items-center gap-3">
                <div class="text-end">
                    <div class="fw-semibold text-primary" id="dashboardUserName">Cargando...</div>
                    <small id="dashboardUserRole">ROL</small>
                </div>
                <button class="btn btn-outline-danger btn-sm px-3" type="button" id="dashboardLogoutBtn">
                    <i class="fa-solid fa-right-from-bracket me-1"></i>Cerrar sesión
                </button>
                <a href="#" class="profile-link d-flex align-items-center text-decoration-none">
                    <img src="../../../img/register2.png" alt="Perfil" class="profile-img">
                </a>
            </div>
        </div>
    </nav>

    <div class="dashboard-wrapper">
        <div class="dashboard-grid">
            <!-- Sidebar -->
            <aside class="col-left">
                <div class="restaurant-card">
                    <div class="restaurant-header">
                        <img src="../../../img/ICON1.png" alt="Yaku Sabor" class="icon-img">
                    </div>

                    <div class="left-options">
                        <!-- Gestión de Sala -->
                        <a href="Gestion DeSala.html" class="btn-pdf js-dashboard-link active"
                            data-title="Gestión de Sala" data-roles="ADMINISTRADOR,MESERO">
                            <i class="fa-solid fa-chair"></i>
                            <span>Gestión de Sala</span>
                        </a>

                        <!-- Gestión Cocina -->
                        <a href="GestionDeCocinav2.html" class="btn-pdf js-dashboard-link"
                            data-title="Gestión Cocina" data-roles="ADMINISTRADOR,COCINERO">
                            <i class="fa-solid fa-fire-burner"></i>
                            <span>Gestión Cocina (KDS)</span>
                        </a>

                        <!-- Gestión de Productos -->
                        <a href="Productos.html" class="btn-pdf js-dashboard-link"
                            data-title="Gestión de Productos" data-roles="ADMINISTRADOR,COCINERO">
                            <i class="fa-solid fa-box-archive"></i>
                            <span>Gestión Productos</span>
                        </a>

                        <!-- Factura -->
                        <a href="Factura.html" class="btn-pdf js-dashboard-link" data-title="Facturación POS"
                            data-roles="ADMINISTRADOR,MESERO">
                            <i class="fa-solid fa-file-invoice-dollar"></i>
                            <span>Facturación & Caja</span>
                        </a>

                        <!-- Reporte Ventas -->
                        <a href="ReporteVentas.html" class="btn-pdf js-dashboard-link" data-title="Reporte de Ventas"
                            data-roles="ADMINISTRADOR">
                            <i class="fa-solid fa-chart-line"></i>
                            <span>Reporte de Ventas</span>
                        </a>

                        <!-- Gestión de Mozos -->
                        <a href="Gestionmozos.html" class="btn-pdf js-dashboard-link"
                            data-title="Gestión de Personal" data-roles="ADMINISTRADOR">
                            <i class="fa-solid fa-users-gear"></i>
                            <span>Gestión Mozos</span>
                        </a>
                    </div>
                </div>
            </aside>

            <!-- Main Workspace Frame -->
            <main class="col-right">
                <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
                    <h2 class="right-title mb-0">
                        <i class="fa-solid fa-gauge-high text-info"></i> Panel Ejecutivo
                    </h2>
                </div>

                <section class="card-panel module-viewer">
                    <div class="d-flex justify-content-between align-items-center gap-2 mb-3 flex-wrap border-bottom pb-2">
                        <h3 id="viewer-title" class="h5 mb-0 fw-bold text-dark">
                            <i class="fa-solid fa-layer-group me-2 text-primary"></i>Gestión de Sala
                        </h3>
                    </div>

                    <div class="w-100">
                        <iframe id="dashboard-content-frame" class="module-frame w-100" title="Contenido del módulo"
                            src="Gestion DeSala.html"></iframe>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../../Shared/JS/api-config.js"></script>
    <script>
        const moduleLinks = Array.from(document.querySelectorAll('.js-dashboard-link'));
        const moduleFrame = document.getElementById('dashboard-content-frame');
        const viewerTitle = document.getElementById('viewer-title');
        const dashboardUserName = document.getElementById('dashboardUserName');
        const dashboardUserRole = document.getElementById('dashboardUserRole');
        const dashboardLogoutBtn = document.getElementById('dashboardLogoutBtn');

        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '../../Principal/HTML/index.html';
        }

        async function loadProfile() {
            try {
                const response = await fetch(`${resolveApiBaseUrl()}/auth/me`, {
                    headers: authHeaders()
                });
                if (!response.ok) {
                    throw new Error('No autorizado');
                }
                const user = await response.json();
                const rolesStr = (user.roles || []).join(', ');
                dashboardUserName.textContent = user.nombre || user.email || 'Usuario';
                dashboardUserRole.textContent = rolesStr || user.role || 'Personal';

                applyRolePermissions(user.roles || []);
            } catch (err) {
                console.warn('Fallback perfil local o token invalido', err);
            }
        }

        function applyRolePermissions(userRoles) {
            const upperRoles = userRoles.map(r => String(r).toUpperCase());
            moduleLinks.forEach(link => {
                const allowedRoles = (link.dataset.roles || '').split(',').map(r => r.trim().toUpperCase());
                const isAllowed = allowedRoles.some(r => upperRoles.includes(r));
                if (!isAllowed && allowedRoles.length > 0) {
                    link.classList.add('disabled');
                    link.style.pointerEvents = 'none';
                    link.style.opacity = '0.4';
                }
            });
        }

        moduleLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                moduleLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');

                const title = link.dataset.title || 'Módulo';
                const targetUrl = link.getAttribute('href');

                viewerTitle.innerHTML = `<i class="fa-solid fa-layer-group me-2 text-primary"></i>${title}`;
                if (targetUrl && targetUrl !== '#') {
                    moduleFrame.src = targetUrl;
                }
            });
        });

        if (dashboardLogoutBtn) {
            dashboardLogoutBtn.addEventListener('click', () => {
                localStorage.removeItem('token');
                window.location.href = '../../Principal/HTML/index.html';
            });
        }

        loadProfile();
    </script>
</body>

</html>
