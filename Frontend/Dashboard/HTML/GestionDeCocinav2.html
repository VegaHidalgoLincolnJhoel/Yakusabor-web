<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Cocina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/styledash.css">
    <style>
        body {
            background: transparent;
        }

        .kitchen-dashboard {
            padding: 20px;
        }

        .mesa-card {
            background: rgba(255, 255, 255, 0.93);
            border: 1px solid #dbe3ea;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .mesa-card-title {
            color: #1b3a57;
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mesa-card-title .badge {
            font-size: 0.75rem;
        }

        .kitchen-table {
            margin-bottom: 0;
        }

        .kitchen-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .kitchen-actions .btn {
            font-size: 0.78rem;
            padding: 3px 8px;
        }

        .estado-badge {
            font-size: 0.78rem;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 600;
        }

        .estado-pendiente {
            background: #f0f0f0;
            color: #555;
        }

        .estado-en_preparacion {
            background: #fff3cd;
            color: #856404;
        }

        .estado-listo {
            background: #d1e7dd;
            color: #0f5132;
        }

        .estado-entregado {
            background: #cfe2ff;
            color: #084298;
        }

        .refresh-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        #ultimaActualizacion {
            font-size: 0.82rem;
            color: #666;
        }

        #refresh-countdown {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        #sinPedidos {
            display: none;
        }

        .btn-platillos {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: #1b3a57;
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 7px 18px;
            font-size: .85rem;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s, transform .15s;
            letter-spacing: .02em;
        }

        .btn-platillos:hover {
            background: #2f5b84;
            transform: translateY(-1px);
        }

        #modalPlatillos .modal-content {
            border: none;
            border-radius: 16px;
            box-shadow: 0 24px 64px rgba(27, 58, 87, .20);
            overflow: hidden;
        }

        #modalPlatillos .modal-header {
            background: #1b3a57;
            color: #fff;
            padding: 16px 22px;
            border: none;
        }

        #modalPlatillos .modal-header .btn-close {
            filter: invert(1) brightness(2);
        }

        #modalPlatillos .modal-title {
            font-size: 1rem;
            font-weight: 700;
        }

        #modalPlatillos .modal-body {
            padding: 0;
            background: #f4f8fc;
        }

        #modalPlatillos .modal-footer {
            border-top: 1px solid #dbe3ea;
            background: #fff;
            padding: 12px 20px;
        }

        .cat-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 16px 20px 0;
            background: #fff;
            border-bottom: 2px solid #dbe3ea;
        }

        .cat-tab {
            border: 1px solid #c9daef;
            border-bottom: none;
            background: #f4f8fc;
            color: #1b3a57;
            border-radius: 10px 10px 0 0;
            padding: 7px 16px;
            font-size: .82rem;
            font-weight: 700;
            cursor: pointer;
            transition: background .18s, color .18s;
            white-space: nowrap;
        }

        .cat-tab:hover {
            background: #e8f1fb;
        }

        .cat-tab.active {
            background: #1b3a57;
            color: #fff;
            border-color: #1b3a57;
        }

        .cat-panel {
            display: none;
            padding: 16px 20px;
        }

        .cat-panel.active {
            display: block;
        }

        .platillos-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(27, 58, 87, .07);
        }

        .platillos-table thead th {
            background: #1b3a57;
            color: #fff;
            padding: 10px 14px;
            font-size: .78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .platillos-table tbody tr {
            border-bottom: 1px solid #edf2f7;
            transition: background .12s;
        }

        .platillos-table tbody tr:last-child {
            border-bottom: none;
        }

        .platillos-table tbody tr:hover {
            background: #f0f6ff;
        }

        .platillos-table tbody td {
            padding: 11px 14px;
            font-size: .88rem;
            vertical-align: middle;
        }

        .avail-switch {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .avail-switch input[type="checkbox"] {
            width: 40px;
            height: 22px;
            cursor: pointer;
            accent-color: #1b3a57;
            border-radius: 999px;
        }

        .avail-label-on {
            color: #0d6832;
            font-weight: 700;
            font-size: .82rem;
        }

        .avail-label-off {
            color: #a51628;
            font-weight: 700;
            font-size: .82rem;
        }

        .modal-empty {
            text-align: center;
            padding: 40px 20px;
            color: #8fa3b0;
            font-size: .9rem;
        }

        .spinner-sm {
            width: 18px;
            height: 18px;
            border: 2.5px solid #dbe3ea;
            border-top-color: #1b3a57;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .modal-status {
            font-size: .8rem;
            min-height: 24px;
            padding: 0 20px 10px;
            background: #f4f8fc;
        }

        .avail-counter {
            font-size: .78rem;
            color: #6b7b8a;
            padding: 8px 20px 4px;
            background: #f4f8fc;
        }

        .avail-counter strong {
            color: #1b3a57;
        }
    </style>
</head>

<body>
    <main class="container-fluid kitchen-dashboard">
        <div class="refresh-bar">
            <button class="btn-platillos" id="btnEstadoPlatillos">Estado Platillos</button>
            <button class="btn btn-sm btn-outline-secondary" id="btnRefresh">↺ Actualizar</button>
            <span id="ultimaActualizacion">–</span>
        </div>

        <div id="mesasContainer"></div>

        <div id="sinPedidos" class="text-center text-muted py-5">
            <p style="font-size:1.2rem;">✅ No hay pedidos activos en este momento.</p>
        </div>
    </main>

    <!-- MODAL Estado Platillos -->
    <div class="modal fade" id="modalPlatillos" tabindex="-1" aria-labelledby="modalPlatillosLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalPlatillosLabel">🍽️ Estado de Platillos</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="cat-tabs" id="catTabs">
                        <div class="modal-empty"><span class="spinner-sm"></span> Cargando categorías…</div>
                    </div>
                    <div class="avail-counter" id="availCounter" style="display:none"></div>
                    <div class="modal-status" id="platillosStatus"></div>
                    <div id="catPanels"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function resolveApiBaseUrl() {
            const override = window.__API_BASE_URL__ || localStorage.getItem("apiBaseUrl");
            if (override) return override.replace(/\/$/, "");
            const { origin, hostname, protocol } = window.location;
            if (hostname.endsWith(".app.github.dev") || hostname.endsWith(".githubpreview.dev")) {
                return origin.replace(/-(\d+)\.app\.github\.dev$/, "-8080.app.github.dev")
                    .replace(/-(\d+)\.githubpreview\.dev$/, "-8080.githubpreview.dev") + "/api";
            }
            return `${protocol}//${hostname}:8080/api`;
        }
        const API_BASE_URL = resolveApiBaseUrl();

        function authHeaders() {
            const token = localStorage.getItem("token");
            return {
                "Content-Type": "application/json",
                ...(token ? { Authorization: `Bearer ${token}` } : {})
            };
        }
    </script>
    <script src="../JS/GestionCocina.js"></script>
</body>

</html>
