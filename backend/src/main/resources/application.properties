# ==========================================
# YakuSabor — Configuración del backend
# ==========================================

spring.application.name=backend

# ── Base de datos ──────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/yaku_sabores?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234

# ── Hibernate / JPA ───────────────────────
# "none" → Hibernate no toca las tablas; el script SQL es la fuente de verdad.
# Cambiar a "update" solo si se agregan campos nuevos al modelo Java y se quiere
# que Hibernate los cree automáticamente sin rehacer el script.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Servidor ──────────────────────────────
server.port=8080

# ── Cifrado simétrico (AES) ──────────────
app.encryption.secret=${ENCRYPTION_SECRET:yakusabor-clave-cifrado-32-byte}

# ── JWT ───────────────────────────────────
# Mínimo 64 caracteres para HS512 (512 bits)
jwt.secret=yakusabor-clave-secreta-muy-larga-para-hs512-necesita-minimo-64-caracteres-aqui
jwt.expiration=86400000
